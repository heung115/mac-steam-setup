name: Game compatibility report / 게임 호환성 제보
description: Tell us whether a Windows Steam game works. Successful games are welcome too. / 실행 성공한 게임도 알려주세요.
title: "[Game] "
labels:
  - game-compatibility
body:
  - type: markdown
    attributes:
      value: |
        One report per game makes results easier to find. 게임 하나당 제보 하나를 권장합니다.

  - type: input
    id: game
    attributes:
      label: Game title / 게임 이름
      placeholder: Game title as shown in Steam
    validations:
      required: true

  - type: input
    id: appid
    attributes:
      label: Steam App ID
      description: Optional. It appears in the store URL. / 선택 사항이며 Steam 상점 주소에서 확인할 수 있습니다.

  - type: dropdown
    id: result
    attributes:
      label: Result / 실행 결과
      options:
        - Works well / 잘 실행됨
        - Works with minor issues / 약간의 문제가 있지만 실행됨
        - Launches but is not playable / 실행되지만 플레이하기 어려움
        - Does not launch / 실행되지 않음
        - Blocked by anti-cheat / 안티치트로 차단됨
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac model and chip / Mac 모델과 칩
      placeholder: MacBook Air, M2
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version / macOS 버전
      placeholder: macOS 26.6.2
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details / 상세 내용
      description: Mention graphics, audio, controller, performance, crashes, or any workaround. / 그래픽, 소리, 컨트롤러, 성능, 충돌, 해결 방법 등을 알려주세요.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 개인정보 확인
      options:
        - label: I checked that attached material contains no private or secret information. / 첨부 자료에 개인정보나 비밀값이 없는지 확인했습니다.
          required: true
