name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run regression tests
        run: bash Tests/run.sh

      - name: Build app
        run: ./build.command

      - name: Verify app
        run: |
          codesign --verify --deep --strict "build/Mac Steam Setup.app"
          test "$(lipo -archs 'build/Mac Steam Setup.app/Contents/MacOS/MacSteamSetup')" = "arm64"
          test -f "build/Mac Steam Setup.app/Contents/Resources/en.lproj/Localizable.strings"
          test -f "build/Mac Steam Setup.app/Contents/Resources/ko.lproj/Localizable.strings"
          test -f "build/Mac Steam Setup.app/Contents/Resources/localization.sh"

      - name: Verify DMG packaging
        timeout-minutes: 2
        run: |
          bash scripts/create_dmg.sh "build/Mac Steam Setup.app" "build/Mac-Steam-Setup-test.dmg"
          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "build/Mac-Steam-Setup-test.dmg"
          test -d "$mount_dir/Mac Steam Setup.app"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          codesign --verify --deep --strict "$mount_dir/Mac Steam Setup.app"
          hdiutil detach "$mount_dir"
