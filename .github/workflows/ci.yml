name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run regression tests
        run: bash Tests/run.sh

      - name: Build app
        run: ./build.command

      - name: Verify app
        run: |
          codesign --verify --deep --strict "build/Mac Steam Setup.app"
          test "$(lipo -archs 'build/Mac Steam Setup.app/Contents/MacOS/MacSteamSetup')" = "arm64"
